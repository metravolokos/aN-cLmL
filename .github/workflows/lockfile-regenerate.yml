name: Android migration lockfile regeneration

on:
  push:
    branches:
      - feature/android-platform-extraction-20261106
    paths:
      - pubspec.yaml
      - .github/workflows/lockfile-regenerate.yml

permissions:
  contents: write

concurrency:
  group: android-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate-lockfile:
    if: github.repository == 'metravolokos/aN-cLmL'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Resolve dependencies using pinned Flutter
        run: flutter pub get
      - name: Commit lockfile only
        shell: bash
        run: |
          set -euo pipefail
          git add pubspec.lock
          if git diff --cached --quiet; then
            echo "Lockfile already matches Android dependencies"
            exit 0
          fi
          git diff --cached --name-only | grep -Fxq pubspec.lock
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(android): resolve lockfile for Android-only dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"
