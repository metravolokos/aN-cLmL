name: One-time position and navigation preflight
on:
  push:
    branches:
      - fix/player-position-detail-navigation-20261107
    paths:
      - .github/workflows/position-navigation-preflight.yml
      - lib/data/audio/playback_controller.dart
      - lib/presentation/app_bottom_navigation_bar.dart
      - lib/presentation/now_playing_page.dart
      - lib/presentation/album_detail_page.dart
      - lib/presentation/library_page.dart
      - lib/app/shell.dart
      - test/detail_navigation_test.dart
      - test/now_playing_position_test.dart
permissions:
  contents: write
jobs:
  focused-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format lib test
      - name: Commit formatting if required
        shell: bash
        run: |
          set -euo pipefail
          git add lib test
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(android): format seek and navigation changes'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - run: flutter analyze
      - run: flutter test test/detail_navigation_test.dart test/now_playing_position_test.dart test/album_detail_page_test.dart test/artist_mini_player_layout_test.dart test/app_test.dart test/android_audio_event_lifecycle_test.dart
