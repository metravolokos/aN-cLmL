name: One-time resolved Android diagnostics formatter
on:
  push:
    branches: [fix/android-library-refresh-diagnostics-20261106]
    paths:
      - .github/workflows/diagnostic-format-resolved.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - run: dart format lib test
      - name: Commit resolved formatting only
        shell: bash
        run: |
          set -euo pipefail
          git add lib test
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(android): format diagnostics with resolved Flutter lints'
          git push origin "HEAD:${GITHUB_REF_NAME}"
