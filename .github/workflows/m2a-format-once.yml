name: ChatGPT M2A one-shot formatter
on:
  push:
    branches: [experiment/chatgpt-m2a]
permissions:
  contents: write
jobs:
  format-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/chatgpt-m2a
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Apply official Dart formatter and commit
        run: |
          dart format lib test
          git add lib test
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore(m2a-chatgpt): apply Dart formatter'
            git push origin HEAD:refs/heads/experiment/chatgpt-m2a
          fi
      - name: Analyze and run focused tests
        run: |
          flutter gen-l10n
          flutter analyze
          flutter test
          python -m unittest discover -s tests -v
