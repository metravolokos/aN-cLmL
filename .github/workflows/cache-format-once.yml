name: One-time formatting for cache playback wiring
on:
  push:
    branches: [feature/cache-playback-wiring-20261105]
    paths: [.github/workflows/cache-format-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cache-playback-wiring-20261105
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Format exact Dart sources
        run: dart format lib test
      - name: Commit canonical Dart formatter changes
        shell: bash
        run: |
          set -eu
          git add lib test
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style: apply canonical Dart formatting to integrated player'
            git push origin HEAD:refs/heads/feature/cache-playback-wiring-20261105
          fi
