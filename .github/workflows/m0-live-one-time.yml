name: One-time bounded live WebDAV verification
on:
  push:
    branches:
      - experiment/live-m0-repo-secrets-20261105
    paths:
      - .github/workflows/m0-live-one-time.yml

permissions:
  contents: read

jobs:
  live-read-only:
    if: github.repository == 'metravolokos/cloudmail-player-m0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline parser contracts
        run: python -m unittest discover -s tests -v
      - name: Bounded live WebDAV probe with existing secret aliases
        shell: bash
        env:
          U0: ${{ secrets.WEBDAV_USERNAME }}
          P0: ${{ secrets.WEBDAV_PASSWORD }}
          U1: ${{ secrets.WEBDAV_LOGIN }}
          P1: ${{ secrets.WEBDAV_PASS }}
          U2: ${{ secrets.CLOUDMAIL_USERNAME }}
          P2: ${{ secrets.CLOUDMAIL_PASSWORD }}
          U3: ${{ secrets.CLOUDMAIL_LOGIN }}
          P3: ${{ secrets.CLOUDMAIL_APP_PASSWORD }}
          U4: ${{ secrets.MAILRU_LOGIN }}
          P4: ${{ secrets.MAILRU_PASSWORD }}
        run: |
          set -eu
          username=""
          password=""
          for id in 0 1 2 3 4; do
            u="U$id"
            p="P$id"
            candidate_user="${!u}"
            candidate_password="${!p}"
            if [ -n "$candidate_user" ] && [ -n "$candidate_password" ]; then
              username="$candidate_user"
              password="$candidate_password"
              break
            fi
          done
          if [ -z "$username" ] || [ -z "$password" ]; then
            echo 'BLOCKED: No matching accessible pair of repository secret aliases.'
            exit 2
          fi
          export WEBDAV_USERNAME="$username"
          export WEBDAV_PASSWORD="$password"
          python tools/webdav_probe.py --live
