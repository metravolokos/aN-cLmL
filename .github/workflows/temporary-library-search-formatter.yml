name: Temporary library search formatter
on:
  push:
    branches: [feature/symfonium-library-search-20261106]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format lib/domain/library_search.dart lib/presentation/library_page.dart test/library_search_test.dart
      - name: Save formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/domain/library_search.dart lib/presentation/library_page.dart test/library_search_test.dart
          if ! git diff --cached --quiet; then
            git commit -m "style(ui): format library search"
            git push origin HEAD:refs/heads/feature/symfonium-library-search-20261106
          fi
