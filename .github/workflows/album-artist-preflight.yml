name: One-time album and artist preflight
on:
  push:
    branches: [feature/android-album-artist-detail-refresh-20261107]
    paths:
      - .github/workflows/album-artist-preflight.yml
      - test/album_detail_page_test.dart
permissions:
  contents: write
jobs:
  focused-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format lib test
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git add lib test
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(android): format album and artist redesign'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - run: flutter analyze
      - run: flutter test test/collection_summary_test.dart test/album_detail_page_test.dart test/artist_mini_player_layout_test.dart test/detail_navigation_test.dart test/track_row_artwork_test.dart test/app_test.dart
