name: One-time catalog refresh formatter
on:
  push:
    branches: [fix/catalog-after-connect-all-platforms-20261106]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format lib/app/shell.dart lib/data/library/cloud_music_service.dart test/catalog_connect_refresh_test.dart
      - name: Save formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/app/shell.dart lib/data/library/cloud_music_service.dart test/catalog_connect_refresh_test.dart
          if ! git diff --cached --quiet; then
            git commit -m "style: format initial cloud catalog refresh fix"
            git push origin HEAD:refs/heads/fix/catalog-after-connect-all-platforms-20261106
          fi
