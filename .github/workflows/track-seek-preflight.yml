name: One-time track and seek preflight
on:
  push:
    branches: [feature/android-track-artwork-linear-seek-20261107]
    paths:
      - .github/workflows/track-seek-preflight.yml
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format lib test
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git add lib test
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(android): format track rows and seek bar'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - run: flutter analyze
      - run: flutter test test/track_row_artwork_test.dart test/now_playing_page_test.dart test/now_playing_position_test.dart test/album_detail_page_test.dart test/artist_mini_player_layout_test.dart
