name: One-time Windows SMTC dependency bootstrap
on:
  push:
    branches: [feature/windows-smtc-20261105]
permissions:
  contents: write
jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib test
      - name: Commit dependency lock and formatted code
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock lib test
          if ! git diff --cached --quiet; then
            git commit -m "build: lock Windows SMTC plugin and format source"
            git push origin "HEAD:refs/heads/feature/windows-smtc-20261105"
          fi
