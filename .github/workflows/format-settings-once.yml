name: Format settings reindex change once
on:
  push:
    branches: [fix/settings-reindex-20261106]
    paths: [.github/workflows/format-settings-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - run: dart format lib/app/shell.dart test/library_import_resume_test.dart
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git add lib/app/shell.dart test/library_import_resume_test.dart
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(android): format settings reindex widget and test'
          git push origin "HEAD:${GITHUB_REF_NAME}"
