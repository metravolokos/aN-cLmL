name: Temporary Dart formatter for artwork
on:
  push:
    branches: [feature/flac-embedded-artwork-20261105]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: dart format lib/data/artwork/flac_artwork_reader.dart test/flac_artwork_reader_test.dart lib/data/library/cloud_music_service.dart lib/presentation/now_playing_page.dart
      - name: Commit formatter output to feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/data/artwork/flac_artwork_reader.dart test/flac_artwork_reader_test.dart lib/data/library/cloud_music_service.dart lib/presentation/now_playing_page.dart
          if ! git diff --cached --quiet; then
            git commit -m "style: format integrated FLAC artwork UI"
            git push origin "HEAD:refs/heads/feature/flac-embedded-artwork-20261105"
          fi
