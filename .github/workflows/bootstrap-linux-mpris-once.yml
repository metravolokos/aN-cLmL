name: One-time Linux MPRIS lock and format
on:
  push:
    branches:
      - feature/linux-mpris-20261106
    paths:
      - .github/workflows/bootstrap-linux-mpris-once.yml
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
      - run: flutter pub get
      - run: dart format lib/main.dart lib/platform/linux/linux_mpris_controls.dart test/linux_mpris_metadata_test.dart
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pubspec.lock lib/main.dart lib/platform/linux/linux_mpris_controls.dart test/linux_mpris_metadata_test.dart
          if ! git diff --cached --quiet; then
            git commit -m "build(linux): lock MPRIS dependencies and apply Dart formatting"
            git push origin HEAD:feature/linux-mpris-20261106
          fi
