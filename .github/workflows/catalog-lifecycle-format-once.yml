name: One-time catalog lifecycle formatter and targeted test
on:
  push:
    branches: [fix/await-catalog-listing-20261106]
    paths: [.github/workflows/catalog-lifecycle-format-once.yml]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - run: dart format lib test
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git add lib test
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(android): format catalog lifecycle gate and tests'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Focused Settings login/catalog widget test
        run: flutter test test/settings_connect_listing_gate_test.dart
