name: One-time Android focus lock and format
on:
  push:
    branches:
      - feature/android-music-audio-focus-20261106
    paths:
      - .github/workflows/bootstrap-android-focus-once.yml
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
      - run: flutter pub get
      - run: dart format lib/main.dart lib/platform/android/android_audio_session.dart test/android_audio_session_test.dart
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pubspec.lock lib/main.dart lib/platform/android/android_audio_session.dart test/android_audio_session_test.dart
          if ! git diff --cached --quiet; then
            git commit -m "build(android): lock music session and format source"
            git push origin HEAD:feature/android-music-audio-focus-20261106
          fi
