name: Generate Linux runner once
on:
  push:
    branches: [feature/three-platform-player-20261105]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/three-platform-player-20261105
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Generate official Flutter Linux runner
        shell: bash
        run: |
          set -euo pipefail
          flutter config --enable-linux-desktop
          flutter create --no-pub --project-name cloudmail_player --org com.cloudmailplayer --platforms linux .
          rm -f test/widget_test.dart
          git status --short
          git add linux .metadata
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore(linux): add official Flutter desktop runner'
            git push origin HEAD:refs/heads/feature/three-platform-player-20261105
          fi
