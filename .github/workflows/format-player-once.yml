name: Format and analyze player changes once
on:
  push:
    branches: [feature/three-platform-player-20261105]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/three-platform-player-20261105
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Flutter format + localization + analysis
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          dart format lib test
          flutter gen-l10n
          flutter analyze
          flutter test
          python -m unittest discover -s tests -v
          git add lib test
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style: apply Dart formatter to player vertical slice'
            git push origin HEAD:refs/heads/feature/three-platform-player-20261105
          fi
