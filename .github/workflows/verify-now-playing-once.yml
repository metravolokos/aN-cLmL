name: One-time format, analyzer and widget verification
on:
  push:
    branches: [feature/cache-playback-wiring-20261105]
    paths: [.github/workflows/verify-now-playing-once.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cache-playback-wiring-20261105
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Format sources
        run: dart format lib test
      - run: flutter gen-l10n
      - name: Enforce analyzer
        run: flutter analyze
      - name: Run Flutter widget and cache tests
        run: flutter test
      - name: Commit formatted code only after clean checks
        shell: bash
        run: |
          set -eu
          git add lib test
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style: canonical formatting for Now Playing and cache fixes'
            git push origin HEAD:refs/heads/feature/cache-playback-wiring-20261105
          fi
