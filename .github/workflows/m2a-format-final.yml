name: ChatGPT M2A exact widget formatter
on:
  push:
    branches: [experiment/chatgpt-m2a]
permissions:
  contents: write
jobs:
  finish-format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/chatgpt-m2a
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Apply Dart formatter exactly
        run: |
          dart format lib test
          git add lib test
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(m2a-chatgpt): format connection widget test'
            git push origin HEAD:refs/heads/experiment/chatgpt-m2a
          fi
      - name: Verify M2A code and tests
        run: |
          flutter gen-l10n
          flutter analyze
          flutter test
