name: Redacted full-history secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks-history:
    name: secrets-history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history without exposing findings in public logs
        shell: bash
        run: |
          # The repo is public, but candidate secrets must never be printed to
          # GitHub Actions logs, uploaded as artifacts or added as PR comments.
          # Pin the official multi-arch Gitleaks container to an immutable digest.
          set +e
          docker run --rm --network none \
            -v "$PWD:/repo:ro" -w /repo \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --no-banner >/dev/null 2>&1
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then
            echo "Secret-history scan completed: no matches under current rules."
          elif [ "$result" -eq 1 ]; then
            echo "::error::Potential secret found in Git history. Review privately with the maintainer; rotate exposed credentials. No finding details are published."
            exit 1
          else
            echo "::error::History scanner failed (exit code $result); no clean-scan conclusion is possible."
            exit 1
          fi
