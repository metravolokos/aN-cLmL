name: One-time secure live WebDAV verification
on:
  push:
    branches: [feature/complete-player-20261105]
    paths: [.github/workflows/webdav-live-once.yml]
permissions:
  contents: read
jobs:
  readonly-webdav:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      WEBDAV_USERNAME: ${{ secrets.WEBDAV_USERNAME }}
      WEBDAV_PASSWORD: ${{ secrets.WEBDAV_PASSWORD }}
    steps:
      - name: Validate WebDAV /AllMusic without exposing content
        shell: bash
        run: |
          set +x
          python3 - <<'PY'
          import base64, os, sys, urllib.request, urllib.error, xml.etree.ElementTree as ET
          username = os.environ.get("WEBDAV_USERNAME", "")
          password = os.environ.get("WEBDAV_PASSWORD", "")
          if not username or not password:
              print("WebDAV check: repository secrets not mapped; no request sent")
              sys.exit(2)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          url = "https://webdav.cloud.mail.ru/AllMusic/"
          auth = base64.b64encode((username + ":" + password).encode("utf-8")).decode("ascii")
          request = urllib.request.Request(url, method="PROPFIND", headers={
              "Authorization": "Basic " + auth,
              "Depth": "0",
              "Content-Type": "application/xml; charset=utf-8",
          }, data=b'<?xml version="1.0"?><d:propfind xmlns:d="DAV:"><d:prop><d:resourcetype/></d:prop></d:propfind>')
          opener = urllib.request.build_opener(NoRedirect())
          try:
              with opener.open(request, timeout=15) as response:
                  status = response.status
                  body = response.read(524289)
                  if len(body) > 524288:
                      print("WebDAV check: response exceeds strict bound")
                      sys.exit(3)
              root = ET.fromstring(body)
              valid = status == 207 and root.tag == "{DAV:}multistatus"
              print("WebDAV check: HTTP 207 and DAV XML", "PASS" if valid else "FAIL")
              sys.exit(0 if valid else 4)
          except urllib.error.HTTPError as exc:
              print("WebDAV check: HTTP status", exc.code)
              sys.exit(5)
          except Exception:
              print("WebDAV check: network/response validation FAILED (details withheld)")
              sys.exit(6)
          PY
