name: Flutter M1
on:
  push:
    branches: [main, feature/m1-flutter-scaffold]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter create --no-pub --project-name cloudmail_player --platforms=android,windows --org com.cloudmailplayer .
      - run: flutter --version
      - run: dart --version
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart format lib test
      - uses: actions/upload-artifact@v4
        with:
          name: m1-resolved-source
          include-hidden-files: true
          path: |
            pubspec.lock
            .metadata
            lib/
            test/
      - run: flutter analyze
      - run: flutter test
      - run: python -m unittest discover -s tests -v
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: cloudmail-player-windows
          path: build/windows/x64/runner/Release/
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: cloudmail-player-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
