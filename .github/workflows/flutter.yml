name: Flutter M2-A
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter --version
      - run: dart --version
      # Bootstrap the new dependency lock in CI; this update is removed after
      # the generated pubspec.lock is committed in the feature branch.
      - run: flutter pub get
      - run: dart format lib test
      - uses: actions/upload-artifact@v4
        with:
          name: m2a-bootstrap-files
          path: |
            pubspec.lock
            lib/app/shell.dart
            lib/cloud/cloud_mail_webdav.dart
            lib/cloud/cloud_connection_service.dart
            lib/l10n/app_ru.arb
            test/app_test.dart
            test/cloud_mail_webdav_test.dart
            test/cloud_connection_service_test.dart
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: python -m unittest discover -s tests -v
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: cloudmail-player-windows
          path: build/windows/x64/runner/Release/
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted ubuntu-latest includes an Android SDK; avoid setup-android@v3
      # because it invokes the removed SDK 'tools' package on this runner.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug
      - name: Audit Android runtime graph for Google Play Services
        shell: bash
        run: |
          dependency_report="$RUNNER_TEMP/android-runtime-dependencies.txt"
          ./android/gradlew -p android :app:dependencies --configuration debugRuntimeClasspath > "$dependency_report"
          if grep -Eq 'com\.google\.android\.gms:|com\.google\.firebase:' "$dependency_report"; then
            echo 'Google Play Services or Firebase found in the Android runtime dependency graph.'
            exit 1
          fi
          echo 'No Google Play Services or Firebase runtime dependencies found.'
      - uses: actions/upload-artifact@v4
        with:
          name: cloudmail-player-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
