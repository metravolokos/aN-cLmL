name: aN-cLmL — Android and quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - run: dart format --output=none --set-exit-if-changed lib test
      - name: Diagnostic formatting diff (temporary)
        if: failure()
        run: |
          dart format lib/presentation/now_playing_page.dart
          git diff -- lib/presentation/now_playing_page.dart
      - run: flutter analyze
      - run: flutter test
      - run: python -m unittest discover -s tests -v
      - run: bash tools/check_layers.sh

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug
      - name: No GMS or Firebase runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/gradle-runtime.txt"
          ./android/gradlew -p android :app:dependencies --configuration debugRuntimeClasspath > "$report"
          if grep -Eq 'com\.google\.android\.gms:|com\.google\.firebase:' "$report"; then
            echo 'Prohibited Google runtime dependency'
            exit 1
          fi
          echo 'No GMS/Firebase dependency found'
      - name: Android manifest INTERNET permission
        run: grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
      - uses: actions/upload-artifact@v4
        with:
          name: an-clml-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
