name: Generate indexed music schema once
on:
  push:
    branches: [feature/complete-player-20261105]
permissions:
  contents: write
jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/complete-player-20261105
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Regenerate Drift and validate
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          dart run build_runner build
          dart format lib test
          flutter gen-l10n
          flutter analyze
          flutter test
          python -m unittest discover -s tests -v
          git add lib test
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore(index): regenerate Flutter-safe music metadata database'
            git push origin HEAD:refs/heads/feature/complete-player-20261105
          fi
