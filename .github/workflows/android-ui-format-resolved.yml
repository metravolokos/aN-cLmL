name: One-time Dart format with resolved package config
on:
  push:
    branches:
      - feature/android-integrated-buffer-waveform-20261106
    paths:
      - .github/workflows/android-ui-format-resolved.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format lib/data/audio/two_track_cache.dart lib/data/audio/playback_controller.dart lib/presentation/buffered_waveform.dart lib/presentation/now_playing_page.dart test/two_track_cache_test.dart test/now_playing_page_test.dart
      - name: Commit only related Dart files
        shell: bash
        run: |
          set -euo pipefail
          git add lib/data/audio/two_track_cache.dart lib/data/audio/playback_controller.dart lib/presentation/buffered_waveform.dart lib/presentation/now_playing_page.dart test/two_track_cache_test.dart test/now_playing_page_test.dart
          if git diff --cached --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(android): format scoped UI change after pub get"
          git push origin "HEAD:${GITHUB_REF_NAME}"
