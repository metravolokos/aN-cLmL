name: cloudmail_player
description: teStPlaYclouDE — Cloud Mail.ru WebDAV audio player for Android without Google services.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  dio: 5.11.1
  drift: 2.35.3
  path_provider: 2.1.6
  path: 1.9.1
  crypto: 3.0.8
  image: 4.12.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  flutter_secure_storage: 11.2.0
  xml: 7.1.0
  just_audio: 0.10.6
  audio_service: 0.18.19
  audio_session: 0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  drift_dev: 2.35.2
  build_runner: 2.17.1

flutter:
  uses-material-design: true
  generate: true
